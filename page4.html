<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next Surprise</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: #3b0b56;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 159, 179, 0.16), transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(255, 215, 107, 0.13), transparent 24%),
        radial-gradient(circle at 50% 88%, rgba(184, 247, 230, 0.12), transparent 28%);
      pointer-events: none;
      z-index: 1;
    }

    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 3000;
      padding: 10px 20px;
      border: none;
      border-radius: 24px;
      background: #fff5d7;
      color: #3b0b56;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.24);
      transition: 0.3s ease;
    }

    .back-btn:hover {
      background: #ffd76b;
      transform: translateY(-2px);
    }

    .next-arrow-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 3000;
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9fb3, #ffd76b);
      color: #3b0b56;
      font-size: 30px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0,0,0,0.30);
      transition: 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: arrowPulse 1.5s infinite;
    }

    .next-arrow-btn:hover {
      transform: scale(1.12) translateX(3px);
      background: linear-gradient(135deg, #ffd76b, #b8f7e6);
    }

    .surprise-card {
      position: relative;
      z-index: 1000;
      width: 90%;
      max-width: 760px;
      text-align: center;
      padding: 58px 42px;
      border-radius: 38px;
      background: linear-gradient(145deg, rgba(255,255,255,0.17), rgba(255,255,255,0.08));
      border: 1px solid rgba(255,255,255,0.24);
      box-shadow: 0 28px 70px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.22);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .badge {
      display: inline-block;
      padding: 9px 20px;
      border-radius: 30px;
      background: rgba(255,245,215,0.95);
      color: #5b1475;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
      margin-bottom: 20px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 72px;
      color: #ffc8dd;
      margin: 10px 0;
      font-weight: 400;
      text-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    .message {
      color: #b8f7e6;
      font-size: 20px;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto;
      font-weight: 500;
    }

    .hint {
      margin-top: 24px;
      color: #fff5d7;
      font-size: 15px;
      opacity: 0.95;
    }

    .emoji-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 28px;
      font-size: 30px;
    }

    .emoji-row span {
      display: inline-block;
      animation: giftBounce 1.8s infinite;
    }

    .emoji-row span:nth-child(2) {
      animation-delay: 0.25s;
    }

    .emoji-row span:nth-child(3) {
      animation-delay: 0.5s;
    }

    .sparkle,
    .soft-star,
    .mini-confetti {
      position: fixed;
      pointer-events: none;
      z-index: 20;
    }

    .sparkle {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff, 0 0 22px #ffd76b;
      animation: sparkleBlink 1.4s ease-out forwards;
    }

    .soft-star {
      color: #ffd76b;
      animation: starFloat 2.4s ease-in-out forwards;
      text-shadow: 0 0 8px rgba(255,255,255,0.9);
    }

    .mini-confetti {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confettiDrop 3.8s ease-out forwards;
    }

    @keyframes arrowPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 26px rgba(0,0,0,0.30);
      }

      50% {
        transform: scale(1.08);
        box-shadow: 0 12px 34px rgba(255,215,107,0.45);
      }
    }

    @keyframes giftBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes sparkleBlink {
      0% { opacity: 0; transform: scale(0); }
      40% { opacity: 1; transform: scale(1.8); }
      100% { opacity: 0; transform: scale(0); }
    }

    @keyframes starFloat {
      0% { opacity: 0; transform: scale(0.4) rotate(0deg); }
      40% { opacity: 1; transform: scale(1.25) rotate(80deg); }
      100% { opacity: 0; transform: scale(0.3) rotate(180deg); }
    }

    @keyframes confettiDrop {
      0% { opacity: 0; transform: translateY(-40px) rotate(0deg); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(160px) rotate(220deg); }
    }

    @media(max-width:700px) {
      .surprise-card {
        padding: 44px 24px;
      }

      h1 {
        font-size: 48px;
      }

      .message {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
    <audio id="pageAudio" playsinline loop preload="auto">
    <source src="Majnu-Bgm.mp3" type="audio/mpeg">
    </audio>

  <button class="back-btn" onclick="goBack()">Back</button>

  <button class="next-arrow-btn" onclick="goToPuzzlePage()" title="Go to puzzle page">
    ➜
  </button>

  <div class="surprise-card">
    <div class="badge">Next Surprise</div>

    <h1>You unlocked a Memory Puzzle!</h1>

    <p class="message">
      A special picture puzzle is waiting to make you annoy. Tap to get embarrassed!
    </p>

    <p class="hint">
      Arrange the pieces and complete the birthday memory.
    </p>

    <div class="emoji-row">
      <span>🧩</span>
      <span>🎂</span>
      <span>✨</span>
    </div>
  </div>

  <script>
    function goBack() {
      window.location.href = "quiz.html";
    }

    function goToPuzzlePage() {
      window.location.href = "page3.html";
    }

    function createSparkle() {
      const sparkle = document.createElement("div");
      sparkle.className = "sparkle";
      sparkle.style.left = Math.random() * window.innerWidth + "px";
      sparkle.style.top = Math.random() * window.innerHeight + "px";
      document.body.appendChild(sparkle);

      setTimeout(function () {
        sparkle.remove();
      }, 1500);
    }

    function createSoftStar() {
      const star = document.createElement("div");
      const stars = ["✦", "✧", "★", "☆"];
      star.className = "soft-star";
      star.innerHTML = stars[Math.floor(Math.random() * stars.length)];
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.top = Math.random() * window.innerHeight + "px";
      star.style.fontSize = 12 + Math.random() * 20 + "px";
      document.body.appendChild(star);

      setTimeout(function () {
        star.remove();
      }, 2600);
    }

    function createConfetti() {
      const confetti = document.createElement("div");
      const colors = ["#ff9fb3", "#ffd76b", "#b8f7e6", "#e6d7ff", "#ffffff"];

      confetti.className = "mini-confetti";
      confetti.style.left = Math.random() * window.innerWidth + "px";
      confetti.style.top = Math.random() * window.innerHeight * 0.45 + "px";
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.transform = "rotate(" + Math.random() * 180 + "deg)";
      document.body.appendChild(confetti);

      setTimeout(function () {
        confetti.remove();
      }, 3900);
    }

    setInterval(createSparkle, 230);
    setInterval(createSoftStar, 280);
    setInterval(createConfetti, 600);
  

  const pageAudio = document.getElementById("pageAudio");

  function saveAudioState() {
    if (!pageAudio) return;
    sessionStorage.setItem("birthdayAudioTime", pageAudio.currentTime || 0);
    sessionStorage.setItem("birthdayAudioPaused", pageAudio.paused ? "true" : "false");
  }

  async function restoreAndPlayAudio() {
    if (!pageAudio) return;

    const savedTime = sessionStorage.getItem("birthdayAudioTime");
    const wasPaused = sessionStorage.getItem("birthdayAudioPaused");

    if (savedTime) {
      pageAudio.currentTime = parseFloat(savedTime);
    }

    if (wasPaused === "false") {
      try {
        pageAudio.volume = 0.8;
        await pageAudio.play();
      } catch (error) {
        // Browser may require one click before audio can continue.
      }
    }
  }

  document.addEventListener("DOMContentLoaded", restoreAndPlayAudio);

  if (pageAudio) {
    pageAudio.addEventListener("timeupdate", saveAudioState);
  }

  window.addEventListener("beforeunload", saveAudioState);

</script>
</body>
</html>
