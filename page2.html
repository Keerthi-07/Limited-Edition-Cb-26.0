<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touch the Heart</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: #3b0b56;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 159, 179, 0.16), transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(255, 215, 107, 0.13), transparent 24%),
        radial-gradient(circle at 50% 88%, rgba(184, 247, 230, 0.12), transparent 28%);
      pointer-events: none;
      z-index: 1;
    }

    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 3000;
      padding: 10px 20px;
      border: none;
      border-radius: 24px;
      background: #fff5d7;
      color: #3b0b56;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.24);
      transition: 0.3s ease;
    }

    .back-btn:hover {
      background: #ffd76b;
      color: #3b0b56;
      transform: translateY(-2px);
    }

    .decor-circle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: floatCircle 8s ease-in-out infinite alternate;
      z-index: 2;
    }

    .circle-one {
      width: 190px;
      height: 190px;
      top: 8%;
      left: 7%;
      background: rgba(255,255,255,0.08);
    }

    .circle-two {
      width: 135px;
      height: 135px;
      bottom: 12%;
      right: 10%;
      background: rgba(255,215,107,0.11);
      animation-delay: 1.5s;
    }

    .circle-three {
      width: 92px;
      height: 92px;
      top: 20%;
      right: 22%;
      background: rgba(184,247,230,0.12);
      animation-delay: 0.8s;
    }

    .circle-four {
      width: 76px;
      height: 76px;
      bottom: 24%;
      left: 18%;
      background: rgba(255,159,179,0.12);
      animation-delay: 2s;
    }

    .celebration-card {
      text-align: center;
      position: relative;
      z-index: 1000;
      width: 90%;
      max-width: 790px;
      padding: 58px 48px 44px;
      border-radius: 38px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,0.17),
        rgba(255,255,255,0.08)
      );
      border: 1px solid rgba(255,255,255,0.24);
      box-shadow:
        0 28px 70px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.22);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .celebration-card::before {
      content: "";
      position: absolute;
      width: 310px;
      height: 310px;
      top: -130px;
      left: -120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,159,179,0.20), transparent 70%);
      z-index: -1;
    }

    .celebration-card::after {
      content: "";
      position: absolute;
      width: 290px;
      height: 290px;
      bottom: -125px;
      right: -120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,107,0.16), transparent 72%);
      z-index: -1;
    }

    .ribbon {
      position: absolute;
      top: 0;
      right: 36px;
      background: linear-gradient(135deg, #ff9fb3, #ffd76b);
      color: #3b0b56;
      padding: 11px 26px;
      border-radius: 0 0 20px 20px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.26);
      z-index: 3;
    }

    .top-badge {
      display: inline-block;
      padding: 9px 20px;
      border-radius: 30px;
      background: rgba(255,245,215,0.95);
      color: #5b1475;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
      margin-bottom: 18px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      position: relative;
      z-index: 3;
    }

    .touch-text {
      font-size: 28px;
      color: #ffd76b;
      font-weight: 700;
      margin: 8px 0 18px;
      position: relative;
      z-index: 3;
    }

    .heart-zone {
      width: 150px;
      height: 150px;
      margin: 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 3;
    }

    .big-heart {
      font-size: 108px;
      background: transparent;
      border: none;
      cursor: pointer;
      animation: heartBeat 1.15s infinite;
      filter: drop-shadow(0 10px 22px rgba(255,90,138,0.45));
      transition: 0.3s ease;
      position: relative;
      z-index: 4;
    }

    .big-heart:hover {
      transform: scale(1.18) rotate(-5deg);
      filter: drop-shadow(0 12px 28px rgba(255,215,107,0.58));
    }

    h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 68px;
      color: #ffc8dd;
      margin: 18px 0 8px;
      font-weight: 400;
      text-shadow: 0 3px 10px rgba(0,0,0,0.25);
      position: relative;
      z-index: 3;
    }

    .friend-text {
      font-size: 20px;
      color: #b8f7e6;
      line-height: 1.7;
      max-width: 590px;
      margin: 0 auto;
      font-weight: 500;
      position: relative;
      z-index: 3;
    }

    .birthday-note {
      margin: 26px auto 0;
      max-width: 560px;
      padding: 17px 22px;
      background: rgba(255,245,215,0.15);
      border: 1px dashed rgba(255,215,107,0.55);
      border-radius: 20px;
      color: #fff5d7;
      font-size: 15px;
      line-height: 1.7;
      position: relative;
      z-index: 3;
    }

    .hint-text {
      margin-top: 18px;
      color: #e6d7ff;
      font-size: 15px;
      opacity: 0.94;
      position: relative;
      z-index: 3;
    }

    .gift-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      position: relative;
      z-index: 3;
    }

    .gift {
      font-size: 28px;
      display: inline-block;
      animation: giftBounce 1.8s infinite;
    }

    .gift:nth-child(2) {
      animation-delay: 0.25s;
    }

    .gift:nth-child(3) {
      animation-delay: 0.5s;
    }

    .gift:nth-child(4) {
      animation-delay: 0.75s;
    }

    .corner-mark {
      position: absolute;
      font-size: 24px;
      color: rgba(255,245,215,0.75);
      z-index: 3;
    }

    .corner-left {
      left: 30px;
      bottom: 24px;
    }

    .corner-right {
      right: 30px;
      bottom: 24px;
    }

    .sparkle {
      position: fixed;
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px #fff, 0 0 22px #ffd76b;
      animation: sparkleBlink 1.4s ease-out forwards;
      z-index: 20;
    }

    .soft-star {
      position: fixed;
      color: #ffd76b;
      pointer-events: none;
      animation: starFloat 2.4s ease-in-out forwards;
      text-shadow: 0 0 8px rgba(255,255,255,0.9);
      z-index: 20;
    }

    .tiny-dot {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #b8f7e6;
      pointer-events: none;
      animation: dotMove 3s ease-out forwards;
      opacity: 0.82;
      z-index: 20;
    }

    .floating-note {
      position: fixed;
      color: #fff5d7;
      pointer-events: none;
      font-size: 18px;
      animation: noteFloat 3.6s ease-out forwards;
      opacity: 0.82;
      z-index: 20;
    }

    .mini-confetti {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      pointer-events: none;
      animation: confettiDrop 3.8s ease-out forwards;
      z-index: 20;
    }

    @keyframes heartBeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.14);
      }
    }

    @keyframes giftBounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes sparkleBlink {
      0% {
        opacity: 0;
        transform: scale(0);
      }

      40% {
        opacity: 1;
        transform: scale(1.8);
      }

      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    @keyframes starFloat {
      0% {
        opacity: 0;
        transform: scale(0.4) rotate(0deg);
      }

      40% {
        opacity: 1;
        transform: scale(1.25) rotate(80deg);
      }

      100% {
        opacity: 0;
        transform: scale(0.3) rotate(180deg);
      }
    }

    @keyframes dotMove {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.2);
      }
    }

    @keyframes noteFloat {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.8);
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-110px) scale(1.15);
      }
    }

    @keyframes confettiDrop {
      0% {
        opacity: 0;
        transform: translateY(-40px) rotate(0deg);
      }

      20% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(160px) rotate(220deg);
      }
    }

    @keyframes floatCircle {
      0% {
        transform: translateY(0) scale(1);
      }

      100% {
        transform: translateY(-28px) scale(1.08);
      }
    }

    @media(max-width:700px) {
      .celebration-card {
        padding: 44px 24px 34px;
      }

      .touch-text {
        font-size: 22px;
      }

      .heart-zone {
        width: 125px;
        height: 125px;
      }

      .big-heart {
        font-size: 86px;
      }

      h2 {
        font-size: 48px;
      }

      .friend-text {
        font-size: 17px;
      }

      .birthday-note {
        font-size: 14px;
      }

      .ribbon {
        right: 24px;
      }
    }
  </style>
</head>

<body>
    <audio id="pageAudio" playsinline loop preload="auto">
    <source src="Majnu-Bgm.mp3" type="audio/mpeg">
    </audio>

  <button class="back-btn" onclick="goBack()">Back</button>

  <div class="decor-circle circle-one"></div>
  <div class="decor-circle circle-two"></div>
  <div class="decor-circle circle-three"></div>
  <div class="decor-circle circle-four"></div>

  <div class="celebration-card">
    <div class="ribbon">Surprise Loading...</div>

    <div class="top-badge">Please lower your expectations</div>

    <p class="touch-text">Touch the heart to confirm you're old 🎉</p>

    <div class="heart-zone">
      <button class="big-heart" onclick="goToThirdPage()">❤️</button>
    </div>

    <h2>Happy 26th Birthday, Sibi!</h2>

    <p class="friend-text">
      Congrats! You're vintage now!
    </p>

    <div class="birthday-note">
      Today's Agenda: Celebrate CB -> Roast CB -> Remind CB that you're old
    </div>

    <p class="hint-text">
      Tap the heart to unlock the next birthday activity.
    </p>

    <div class="gift-row">
      <span class="gift">🎁</span>
      <span class="gift">🎂</span>
      <span class="gift">✨</span>
      <span class="gift">🎊</span>
    </div>

    <div class="corner-mark corner-left">♡</div>
    <div class="corner-mark corner-right">✦</div>
  </div>

  <script>
    function goBack() {
      window.location.href = "index.html";
    }

    function goToThirdPage() {
        window.location.href = "quiz.html";
    }


    function goToThirdPage() {
    window.location.href = "quiz.html";
    }

    function createSparkle() {
      const sparkle = document.createElement("div");

      sparkle.className = "sparkle";
      sparkle.style.left = Math.random() * window.innerWidth + "px";
      sparkle.style.top = Math.random() * window.innerHeight + "px";

      document.body.appendChild(sparkle);

      setTimeout(function () {
        sparkle.remove();
      }, 1500);
    }

    function createSoftStar() {
      const star = document.createElement("div");
      const stars = ["✦", "✧", "★", "☆"];

      star.className = "soft-star";
      star.innerHTML = stars[Math.floor(Math.random() * stars.length)];
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.top = Math.random() * window.innerHeight + "px";
      star.style.fontSize = 12 + Math.random() * 20 + "px";

      document.body.appendChild(star);

      setTimeout(function () {
        star.remove();
      }, 2600);
    }

    function createTinyDot() {
      const dot = document.createElement("div");

      dot.className = "tiny-dot";
      dot.style.left = Math.random() * window.innerWidth + "px";
      dot.style.top = Math.random() * window.innerHeight + "px";

      document.body.appendChild(dot);

      setTimeout(function () {
        dot.remove();
      }, 3000);
    }

    function createFloatingNote() {
      const note = document.createElement("div");
      const notes = ["♪", "♫", "✧", "♡", "✨"];

      note.className = "floating-note";
      note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
      note.style.left = Math.random() * window.innerWidth + "px";
      note.style.top = Math.random() * window.innerHeight + "px";
      note.style.fontSize = 14 + Math.random() * 18 + "px";

      document.body.appendChild(note);

      setTimeout(function () {
        note.remove();
      }, 3600);
    }

    function createConfetti() {
      const confetti = document.createElement("div");
      const colors = ["#ff9fb3", "#ffd76b", "#b8f7e6", "#e6d7ff", "#ffffff"];

      confetti.className = "mini-confetti";
      confetti.style.left = Math.random() * window.innerWidth + "px";
      confetti.style.top = Math.random() * window.innerHeight * 0.45 + "px";
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.transform = "rotate(" + Math.random() * 180 + "deg)";

      document.body.appendChild(confetti);

      setTimeout(function () {
        confetti.remove();
      }, 3900);
    }

    setInterval(createSparkle, 210);
    setInterval(createSoftStar, 250);
    setInterval(createTinyDot, 180);
    setInterval(createFloatingNote, 420);
    setInterval(createConfetti, 360);

  const pageAudio = document.getElementById("pageAudio");

  function saveAudioState() {
    if (!pageAudio) return;
    sessionStorage.setItem("birthdayAudioTime", pageAudio.currentTime || 0);
    sessionStorage.setItem("birthdayAudioPaused", pageAudio.paused ? "true" : "false");
  }

  async function restoreAndPlayAudio() {
    if (!pageAudio) return;

    const savedTime = sessionStorage.getItem("birthdayAudioTime");
    const wasPaused = sessionStorage.getItem("birthdayAudioPaused");

    if (savedTime) {
      pageAudio.currentTime = parseFloat(savedTime);
    }

    if (wasPaused === "false") {
      try {
        pageAudio.volume = 0.8;
        await pageAudio.play();
      } catch (error) {
        // Browser may require one click before audio can continue.
      }
    }
  }

  document.addEventListener("DOMContentLoaded", restoreAndPlayAudio);

  if (pageAudio) {
    pageAudio.addEventListener("timeupdate", saveAudioState);
  }

  window.addEventListener("beforeunload", saveAudioState);
  </script>

</body>
</html>
